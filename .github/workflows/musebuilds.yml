name: musebuilds

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  musebuilds:
    name: musebuilds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./musebuilds/...
      - name: Test
        run: go test ./musebuilds/... -count=1 -p 1 -parallel 1 -timeout 20m
      - name: Build
        run: go build ./musebuilds/...
