name: public-components

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    name: components (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare component test environment
        shell: bash
        run: |
          socket_root=$(mktemp -d /tmp/sh1.XXXXXX)
          chmod 700 "$socket_root"
          echo "SESSIONHOST_TEST_SOCKET_ROOT=$socket_root" >> "$GITHUB_ENV"
      - name: Component command selection witness
        run: python3 -m unittest discover -s tools/sh1/ci -p 'test_component_selection.py' -v
      - name: Verify dependencies
        run: go mod verify
      - name: Build components
        run: go build -p=1 ./...
      - name: Vet components
        run: go vet -p=1 ./...
      - name: Full component suites
        shell: bash
        run: |
          umask 022
          go test -p=1 -parallel=1 -count=1 ./...
      - name: Remove owned socket root
        if: always()
        shell: bash
        run: |
          if [ -n "$SESSIONHOST_TEST_SOCKET_ROOT" ]; then
            rmdir "$SESSIONHOST_TEST_SOCKET_ROOT"
          fi
