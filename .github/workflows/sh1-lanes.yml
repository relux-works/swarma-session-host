name: sh1-lanes

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      spm_ref:
        description: Board ref to resolve once for all lanes (main for development)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'relux-works/swarma-session-host'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      go_version: ${{ steps.identity.outputs.go_version }}
    env:
      PRIVATE_SOURCE_REPO: ${{ secrets.PRIVATE_SOURCE_REPO }}
      PRIVATE_SOURCE_CLI_DIR: ${{ secrets.PRIVATE_SOURCE_CLI_DIR }}
      PRIVATE_SOURCE_MODULE: ${{ secrets.PRIVATE_SOURCE_MODULE }}
    steps:
      - name: Validate private source configuration
        shell: bash
        run: |
          for name in PRIVATE_SOURCE_REPO PRIVATE_SOURCE_CLI_DIR PRIVATE_SOURCE_MODULE; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "$name must be set as a repository secret before running this workflow" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: host
          persist-credentials: false
          show-progress: false
      - name: Resolve private source quietly
        id: identity
        env:
          PRIVATE_SOURCE_REPO: ${{ secrets.PRIVATE_SOURCE_REPO }}
          SPM_READ_TOKEN: ${{ secrets.SPM_READ_TOKEN }}
          SH1_SOURCE_REF: ${{ inputs.spm_ref || 'main' }}
        run: python3 host/tools/sh1/ci/checkout.py source

  lanes:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: projection
            os: macos-latest
            informative: false
          - lane: projection
            os: ubuntu-latest
            informative: true
          - lane: consumer
            os: ubuntu-latest
            informative: false
    name: ${{ matrix.lane }} (${{ matrix.os }}, ${{ matrix.informative && 'informative' || 'gating' }})
    continue-on-error: ${{ matrix.informative }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: ''
      PRIVATE_SOURCE_CLI_DIR: ${{ secrets.PRIVATE_SOURCE_CLI_DIR }}
      PRIVATE_SOURCE_MODULE: ${{ secrets.PRIVATE_SOURCE_MODULE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: host
          persist-credentials: false
          show-progress: false
      - name: Fetch private source quietly
        env:
          PRIVATE_SOURCE_REPO: ${{ secrets.PRIVATE_SOURCE_REPO }}
          SPM_READ_TOKEN: ${{ secrets.SPM_READ_TOKEN }}
          SH1_SOURCE_REF: ${{ needs.source.outputs.commit }}
        run: python3 host/tools/sh1/ci/checkout.py lane
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ needs.source.outputs.go_version }}
          cache: false
      - name: Run lane and record actual exits
        env:
          SH1_LANE: ${{ matrix.lane }}
          SH1_BOARD_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 host/tools/sh1/ci/run.py
      - name: Upload reports only (never checkout, candidate, cache, proxy or logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sh1-${{ matrix.lane }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sh1-reports/summary.json
            ${{ runner.temp }}/sh1-reports/manifest.json
            ${{ runner.temp }}/sh1-reports/project.json
            ${{ runner.temp }}/sh1-reports/inventory.json
            ${{ runner.temp }}/sh1-reports/baseline-inventory.json
            ${{ runner.temp }}/sh1-reports/equivalence.json
            ${{ runner.temp }}/sh1-reports/guards.json
            ${{ runner.temp }}/sh1-reports/mutations.json
            ${{ runner.temp }}/sh1-reports/consumer.json
          if-no-files-found: error
