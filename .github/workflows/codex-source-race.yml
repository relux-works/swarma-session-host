name: codex-source-race

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-source-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare owned socket fixture directory
        shell: bash
        run: |
          socket_root=$(mktemp -d /tmp/sessionhost.XXXXXX)
          chmod 700 "$socket_root"
          echo "SESSIONHOST_TEST_SOCKET_ROOT=$socket_root" >> "$GITHUB_ENV"
      - name: Retained source replacement and concurrent uncertainty regressions
        run: go test -v -race -p=1 -parallel=1 -count=1 -timeout=180s ./sessionmanager -run '^(TestRev5BImageReplacedDuringRead|TestRev5BConcurrentUncertaintyPublication)$'
      - name: Remove owned socket fixture directory
        if: always()
        shell: bash
        run: |
          if [ -n "$SESSIONHOST_TEST_SOCKET_ROOT" ]; then
            rmdir "$SESSIONHOST_TEST_SOCKET_ROOT"
          fi
